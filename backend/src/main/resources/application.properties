server.port=${SERVER_PORT:8080}
servlet.context-path=/

# Database Configuration (MySQL)
spring.datasource.url=${spring.datasource.url=${DB_URL}}
spring.datasource.username=${spring.datasource.username=${DB_USERNAME}}
spring.datasource.password=${spring.datasource.password=${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:SanviMaritimeSecretKeyForJwtTokenGeneration2026MustBeAtLeast256BitsLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:5174,http://127.0.0.1:5174}
